name: User Service CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: userservice-${{ github.ref }}
  cancel-in-progress: false

# Required for checkout and GitHub OIDC -> AWS.
permissions:
  contents: read
  id-token: write

env:
  SERVICE_NAME: userservice

  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "663130434910"

  ECR_REPOSITORY: boutique-userservice

  EKS_CLUSTER_NAME: boutique-dev-eks
  K8S_NAMESPACE: boutique

  HELM_RELEASE: user-dev
  K8S_DEPLOYMENT: userservice
  K8S_SERVICE: userservice

  PLATFORM_REPOSITORY: skmohinudd/boutique-platform-infra
  HELM_CHART_PATH: boutique-platform-infra/helm/userservice

  SONAR_HOST_URL: http://44.199.205.21:9000
  SONAR_PROJECT_KEY: boutique-userservice
  SONAR_PROJECT_NAME: Boutique User Service


jobs:

  # Pull requests validate code but never publish or deploy.
  pr-validation:
    name: Validate User Service

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      - name: Prepare Maven
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw


      - name: Run tests
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw \
            -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean test \
            > /tmp/test.log 2>&1
          then
            echo "Tests passed"
          else
            echo "Tests failed"
            tail -n 80 /tmp/test.log
            exit 1
          fi


      - name: Validate SonarQube server
        run: |
          case "$SONAR_HOST_URL" in
            http://*|https://*)
              echo "SonarQube URL format valid"
              ;;
            *)
              echo "Invalid SonarQube URL"
              exit 1
              ;;
          esac


      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw \
            -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="$SONAR_PROJECT_NAME" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            > /tmp/sonar.log 2>&1
          then
            echo "SonarQube analysis completed"
          else
            echo "SonarQube analysis failed"
            tail -n 80 /tmp/sonar.log
            exit 1
          fi


  # Push/manual execution on main performs the complete deployment.
  deploy-main:
    name: Build and Deploy User Service

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # Same immutable version is used by Maven, Nexus, Sonar, ECR and Helm.
      - name: Generate application version
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

          APP_VERSION="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          if ./mvnw \
            -q \
            --batch-mode \
            --no-transfer-progress \
            versions:set \
            -DnewVersion="$APP_VERSION" \
            -DgenerateBackupPoms=false \
            > /tmp/version.log 2>&1
          then
            echo "Version: $APP_VERSION"
          else
            echo "Maven version update failed"
            tail -n 60 /tmp/version.log
            exit 1
          fi


      - name: Test and build JAR
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw \
            -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean package \
            > /tmp/build.log 2>&1
          then
            JAR_NAME="${SERVICE_NAME}-${APP_VERSION}.jar"

            test -f "target/$JAR_NAME"

            echo "JAR_NAME=$JAR_NAME" >> "$GITHUB_ENV"

            echo "Build passed: $JAR_NAME"
          else
            echo "Build failed"
            tail -n 100 /tmp/build.log
            exit 1
          fi


      - name: Validate SonarQube server
        run: |
          case "$SONAR_HOST_URL" in
            http://*|https://*)
              echo "SonarQube URL format valid"
              ;;
            *)
              echo "Invalid SonarQube URL"
              exit 1
              ;;
          esac


      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw \
            -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="$SONAR_PROJECT_NAME" \
            -Dsonar.projectVersion="$APP_VERSION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            > /tmp/sonar.log 2>&1
          then
            echo "SonarQube analysis completed"
          else
            echo "SonarQube analysis failed"
            tail -n 80 /tmp/sonar.log
            exit 1
          fi


      - name: Publish JAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

        run: |
          if ./mvnw \
            -q \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            deploy \
            -DskipTests \
            > /tmp/nexus.log 2>&1
          then
            echo "Nexus artifact published: $JAR_NAME"
          else
            echo "Nexus publish failed"
            tail -n 80 /tmp/nexus.log
            exit 1
          fi


      # OIDC gives the workflow temporary AWS credentials.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: userservice-${{ github.run_id }}
          allowed-account-ids: "663130434910"


      - name: Validate AWS and ECR
        run: |
          ACCOUNT="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "AWS and ECR verified"


      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

        run: |
          IMAGE_REPOSITORY="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${APP_VERSION}"

          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          if docker build \
            --quiet \
            --label "org.opencontainers.image.version=$APP_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_URI" \
            . \
            > /tmp/docker.log 2>&1
          then
            echo "Docker image built"
          else
            echo "Docker build failed"
            tail -n 80 /tmp/docker.log
            exit 1
          fi


      # Trivy intentionally disabled until the S3 reporting design is added.


      - name: Push Docker image to ECR
        run: |
          if docker push \
            --quiet \
            "$IMAGE_URI" \
            > /tmp/ecr.log 2>&1
          then
            echo "ECR image pushed"
          else
            echo "ECR push failed"
            tail -n 80 /tmp/ecr.log
            exit 1
          fi

          IMAGE_DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$APP_VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          test -n "$IMAGE_DIGEST"
          test "$IMAGE_DIGEST" != "None"

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"


      - name: Setup kubectl
        uses: azure/setup-kubectl@v5.1.0


      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0


      # Helm charts are stored in the central platform repository.
      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          path: boutique-platform-infra
          persist-credentials: false


      - name: Validate Helm chart
        run: |
          test -f "$HELM_CHART_PATH/Chart.yaml"
          test -f "$HELM_CHART_PATH/values.yaml"

          if helm lint \
            "$HELM_CHART_PATH" \
            > /tmp/helm-lint.log 2>&1
          then
            echo "Helm lint passed"
          else
            echo "Helm lint failed"
            tail -n 80 /tmp/helm-lint.log
            exit 1
          fi

          if helm template \
            "$HELM_RELEASE" \
            "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            > /tmp/userservice-rendered.yaml \
            2> /tmp/helm-template.log
          then
            echo "Helm rendering passed"
          else
            echo "Helm rendering failed"
            tail -n 80 /tmp/helm-template.log
            exit 1
          fi

          test -s /tmp/userservice-rendered.yaml


      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            > /dev/null

          kubectl get namespace \
            "$K8S_NAMESPACE" \
            > /dev/null

          echo "EKS access verified"


      # Helm performs a rolling update. --atomic rolls back failed upgrades.
      - name: Deploy User Service with Helm
        run: |
          CURRENT_IMAGE="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' \
            2>/dev/null || true)"

          echo "Previous image: ${CURRENT_IMAGE:-not-deployed}"
          echo "New image     : $IMAGE_URI"

          if helm upgrade \
            --install \
            "$HELM_RELEASE" \
            "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            --atomic \
            --cleanup-on-fail \
            --history-max 5 \
            --wait \
            --timeout 5m \
            > /tmp/helm-deploy.log 2>&1
          then
            echo "Helm deployment completed"
          else
            echo "Helm deployment failed"

            tail -n 100 /tmp/helm-deploy.log

            kubectl get pods \
              -n "$K8S_NAMESPACE" \
              -l app="$SERVICE_NAME" \
              -o wide \
              || true

            exit 1
          fi


      - name: Validate Kubernetes deployment
        run: |
          if kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s \
            > /tmp/rollout.log 2>&1
          then
            echo "Kubernetes rollout completed"
          else
            echo "Kubernetes rollout failed"
            tail -n 80 /tmp/rollout.log
            exit 1
          fi

          DEPLOYED_IMAGE="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          if [[ "$DEPLOYED_IMAGE" != "$IMAGE_URI" ]]
          then
            echo "Expected: $IMAGE_URI"
            echo "Running : $DEPLOYED_IMAGE"
            exit 1
          fi

          READY="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}')"

          DESIRED="$(kubectl get deployment \
            "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"

          test "${READY:-0}" = "$DESIRED"

          echo "Deployment ready: ${READY}/${DESIRED}"


      - name: Validate Service endpoints
        run: |
          kubectl get service \
            "$K8S_SERVICE" \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          SERVICE_PORT="$(kubectl get service \
            "$K8S_SERVICE" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.ports[0].port}')"

          ENDPOINTS="$(kubectl get endpointslice \
            -n "$K8S_NAMESPACE" \
            -l kubernetes.io/service-name="$K8S_SERVICE" \
            -o jsonpath='{range .items[*].endpoints[*]}{.addresses[0]}{" "}{end}')"

          test -n "$ENDPOINTS"

          echo "Service endpoints verified"
          echo "SERVICE_PORT=$SERVICE_PORT" >> "$GITHUB_ENV"


      # Test through Kubernetes DNS -> Service -> Pod.
      - name: Validate User Service health
        run: |
          TEST_POD="userservice-health-${GITHUB_RUN_ID}"

          cleanup() {
            kubectl delete pod \
              "$TEST_POD" \
              -n "$K8S_NAMESPACE" \
              --ignore-not-found \
              > /dev/null 2>&1 || true
          }

          trap cleanup EXIT

          kubectl run \
            "$TEST_POD" \
            --restart=Never \
            --image=curlimages/curl \
            -n "$K8S_NAMESPACE" \
            --command -- \
            curl \
            --fail \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            "http://${K8S_SERVICE}:${SERVICE_PORT}/actuator/health" \
            > /dev/null

          kubectl wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/"$TEST_POD" \
            -n "$K8S_NAMESPACE" \
            --timeout=120s \
            > /dev/null

          HEALTH="$(kubectl logs \
            "$TEST_POD" \
            -n "$K8S_NAMESPACE")"

          if echo "$HEALTH" | grep -q '"status":"UP"'
          then
            echo "User Service health: UP"
          else
            echo "User Service health check failed"
            echo "$HEALTH"
            exit 1
          fi


      - name: Deployment summary
        run: |
          REVISION="$(helm history \
            "$HELM_RELEASE" \
            -n "$K8S_NAMESPACE" \
            -o json \
            | jq -r '.[-1].revision')"

          echo "----------------------------------------"
          echo "User Service deployment completed"
          echo "Version       : $APP_VERSION"
          echo "Nexus JAR     : $JAR_NAME"
          echo "ECR image     : $IMAGE_URI"
          echo "ECR digest    : $IMAGE_DIGEST"
          echo "Helm release  : $HELM_RELEASE"
          echo "Helm revision : $REVISION"
          echo "EKS deployment: $K8S_DEPLOYMENT"
          echo "Health        : UP"
          echo "----------------------------------------"